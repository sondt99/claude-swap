<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>cswap</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --line: #e3e6ec;
    --ink: #14161a;
    --muted: #6b7280;
    --faint: #9aa1ad;
    --accent: #3b6cf0;
    --ok: #16a34a;
    --warn: #d68207;
    --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16, 20, 30, .06), 0 4px 14px rgba(16, 20, 30, .05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014;
      --panel: #171a20;
      --panel-2: #1c2027;
      --line: #2a2f38;
      --ink: #e8eaee;
      --muted: #9aa1ad;
      --faint: #6b7280;
      --accent: #6f92f7;
      --ok: #34d17a;
      --warn: #f0a93c;
      --bad: #f4645f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  header {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; margin-bottom: 22px;
  }
  h1 {
    font-size: 17px; font-weight: 650; margin: 0;
    letter-spacing: -.01em;
  }
  h1 span { color: var(--faint); font-weight: 400; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint); flex: none;
    transition: background .25s;
  }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.dead { background: var(--bad); }
  .spacer { flex: 1 1 auto; }

  button {
    font: inherit; font-weight: 500;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--faint); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.tiny { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 16px 13px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 11px;
    position: relative; overflow: hidden;
  }
  .card.active { border-color: var(--accent); }
  .card.active::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--accent);
  }
  .card.off { opacity: .62; }

  .row { display: flex; align-items: baseline; gap: 8px; }
  .slot {
    font-variant-numeric: tabular-nums; font-weight: 650;
    color: var(--faint); font-size: 12px; flex: none;
    min-width: 16px;
  }
  .email {
    font-weight: 550; letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub { color: var(--muted); font-size: 12px; display: flex; gap: 7px; flex-wrap: wrap; }

  .badge {
    font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
    flex: none; line-height: 1.5;
  }
  .badge.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .badge.off { background: color-mix(in srgb, var(--faint) 20%, transparent); color: var(--muted); }
  .badge.alias { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); text-transform: none; letter-spacing: 0; }

  .meter { display: flex; flex-direction: column; gap: 4px; }
  .meter-top {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .meter-top b {
    color: var(--ink); font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 12.5px;
  }
  .meter-top .when { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); }
  .bar {
    height: 6px; border-radius: 99px; overflow: hidden;
    background: color-mix(in srgb, var(--faint) 22%, transparent);
  }
  .bar > i {
    display: block; height: 100%; border-radius: 99px;
    background: var(--ok); transition: width .5s ease, background .3s;
  }
  .bar > i.w { background: var(--warn); }
  .bar > i.b { background: var(--bad); }
  .pace { font-size: 11.5px; color: var(--warn); }

  .state {
    font-size: 12.5px; color: var(--muted);
    background: var(--panel-2); border: 1px dashed var(--line);
    border-radius: 8px; padding: 9px 11px; text-align: center;
  }
  .scoped { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); }
  .scoped span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .acts .spacer { flex: 1 1 auto; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow); border-radius: 9px;
    padding: 10px 15px; max-width: min(620px, 92vw);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    font-size: 13px; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { border-color: var(--bad); color: var(--bad); }
  #toast.ok { border-color: var(--ok); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .foot { margin-top: 26px; color: var(--faint); font-size: 12px; text-align: center; }

  /* Fetch-health banner. Hidden while healthy; a silent usage-fetch outage
     makes the engine decide on stale data, and nothing else on this page
     would show it. */
  #health {
    display: none; margin: 0 0 16px;
    border: 1px solid var(--bad); border-radius: 10px;
    padding: 11px 14px; font-size: 13px;
    background: color-mix(in srgb, var(--bad) 9%, transparent);
    color: var(--bad);
  }
  #health.show { display: block; }
  #health b { font-weight: 650; }
  #health .hint {
    display: block; margin-top: 5px; font-size: 12px;
    color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Paused is a state you can forget you left on — and forgetting means no
     rate-limit protection. Make it loud rather than a subtle toggle. */
  button#pause.paused {
    background: color-mix(in srgb, var(--warn) 16%, transparent);
    border-color: var(--warn); color: var(--warn); font-weight: 650;
  }
  #paused-note {
    display: none; margin: 0 0 16px;
    border: 1px solid var(--warn); border-radius: 10px;
    padding: 11px 14px; font-size: 13px;
    background: color-mix(in srgb, var(--warn) 9%, transparent);
    color: var(--warn);
  }
  #paused-note.show { display: block; }

  .fresh { font-variant-numeric: tabular-nums; }
  .fresh.old { color: var(--warn); }
  .fresh.bad { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="dot"></div>
    <h1>cswap <span id="active">—</span></h1>
    <div class="spacer"></div>
    <button id="pause">Auto: —</button>
    <button id="rotate">Rotate</button>
    <button id="avail">Next available</button>
    <button id="best" class="primary">Switch to best</button>
  </header>
  <div id="health"></div>
  <div id="paused-note"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const grid = $("grid"), dot = $("dot"), toastEl = $("toast");
let busy = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = "show " + (kind || "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.className = ""; }, 4200);
}

async function post(path, body) {
  if (busy) return;
  busy = true;
  setDisabled(true);
  try {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const j = await r.json().catch(() => ({ ok: false, message: "bad response" }));
    toast(j.message || (j.ok ? "done" : "failed"), j.ok ? "ok" : "err");
  } catch (e) {
    toast(String(e), "err");
  } finally {
    busy = false;
    setDisabled(false);
  }
}

function setDisabled(v) {
  document.querySelectorAll("button").forEach(b => { b.disabled = v; });
}

const cls = (p) => p >= 85 ? "b" : p >= 60 ? "w" : "";

const ago = (s) => s < 60 ? `${Math.round(s)}s`
  : s < 3600 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(1)}h`;

// Data age is shown always, not just once it is alarming: the number a
// decision was made on matters as much as the decision. Red when fetches are
// actually failing, amber past the slowest scheduled cadence (600s + slack).
function freshness(a) {
  if (a.ageSeconds == null) return "";
  const failing = (a.failures || 0) >= 2;
  const k = failing ? "bad" : a.ageSeconds > 900 ? "old" : "";
  const err = failing ? ` · ${esc(a.lastError || "fetch failing")}` : "";
  return `<span class="fresh ${k}">· ${esc(ago(a.ageSeconds))} ago${err}</span>`;
}

function meter(label, w) {
  if (!w) return "";
  const pct = Math.max(0, Math.min(100, Number(w.pct) || 0));
  const when = w.countdown ? `${esc(w.countdown)}${w.clock ? " · " + esc(w.clock) : ""}` : "";
  const pace = (w.aheadOfPace && w.expectedPct != null)
    ? `<div class="pace">vượt nhịp — dự kiến ${esc(w.expectedPct)}%</div>` : "";
  return `<div class="meter">
    <div class="meter-top">${label} <b>${pct}%</b><span class="when">${when}</span></div>
    <div class="bar"><i class="${cls(pct)}" style="width:${pct}%"></i></div>
    ${pace}
  </div>`;
}

function card(a) {
  const id = esc(a.number);
  const cl = ["card", a.isActive ? "active" : "", a.disabled ? "off" : ""].join(" ");
  const badges = [
    a.isActive ? '<span class="badge on">active</span>' : "",
    a.disabled ? '<span class="badge off">disabled</span>' : "",
    a.alias ? `<span class="badge alias">${esc(a.alias)}</span>` : "",
  ].join("");

  let body;
  if (a.usage) {
    body = meter("5h", a.usage.fiveHour) + meter("7d", a.usage.sevenDay);
    const sc = (a.usage.scoped || []).filter(s => s.pct > 0);
    if (sc.length) {
      body += `<div class="scoped">${sc.map(s =>
        `<span>${esc(s.name)} ${esc(s.pct)}%</span>`).join("")}</div>`;
    }
  } else {
    body = `<div class="state">${esc(a.sentinelLabel || a.lastError || "chưa có dữ liệu")}</div>`;
  }

  return `<div class="${cl}">
    <div>
      <div class="row">
        <span class="slot">${id}</span>
        <span class="email" title="${esc(a.email)}">${esc(a.email)}</span>
      </div>
      <div class="sub">
        <span>${esc(a.orgTag)}</span>
        ${a.kind === "api_key" ? "<span>· api key</span>" : ""}
        ${freshness(a)}
        ${badges}
      </div>
    </div>
    ${body}
    <div class="acts">
      ${a.isActive || !a.switchable ? ""
        : `<button class="tiny primary" data-act="switch" data-id="${id}">Switch</button>`}
      <button class="tiny" data-act="alias" data-id="${id}">Alias</button>
      <div class="spacer"></div>
      <button class="tiny" data-act="toggle" data-id="${id}" data-on="${a.disabled ? "0" : "1"}">
        ${a.disabled ? "Enable" : "Disable"}
      </button>
    </div>
  </div>`;
}

let paused = false;

function renderPause(p) {
  paused = !!p;
  const b = $("pause"), note = $("paused-note");
  b.textContent = paused ? "Auto: OFF" : "Auto: ON";
  b.className = paused ? "paused" : "";
  note.className = paused ? "show" : "";
  if (paused) {
    note.innerHTML =
      "<b>Autoswitch đang tắt.</b> Account bạn chọn sẽ đứng yên, " +
      "nhưng bạn <b>không</b> được bảo vệ khỏi rate limit — khi quota cạn " +
      "sẽ không có gì tự chuyển giúp. Bấm <b>Auto: OFF</b> để bật lại.";
  }
}

function render(s) {
  if (s.error) { toast(s.error, "err"); return; }
  renderHealth(s.health);
  renderPause(s.autoswitchPaused);
  const acc = s.accounts || [];
  const active = acc.find(a => a.isActive);
  $("active").textContent = active ? `· ${active.alias || active.email}` : "· no active account";
  grid.innerHTML = acc.length
    ? acc.map(card).join("")
    : '<div class="empty">Chưa có account nào được quản lý. Dùng <code>cswap add</code> để thêm.</div>';
  const t = new Date((s.takenAt || 0) * 1000);
  $("foot").textContent = acc.length
    ? `${acc.length} account · cập nhật ${t.toLocaleTimeString()}` : "";
}

// Usage fetches can fail silently for hours — the engine keeps switching on
// last-good data, just increasingly late. Say so loudly, and name the check
// that distinguishes a TLS-trust problem from a real network one.
function renderHealth(h) {
  const el = $("health");
  if (!h || !h.degraded) { el.className = ""; return; }
  const age = h.maxAgeSeconds != null ? ago(h.maxAgeSeconds) : "?";
  el.innerHTML =
    `<b>Usage fetch đang lỗi</b> — ${h.failingCount} account, ` +
    `dữ liệu cũ nhất ${esc(age)}${h.lastError ? ` · ${esc(h.lastError)}` : ""}. ` +
    `Engine vẫn switch, nhưng dựa trên số liệu lỗi thời nên sẽ trễ.` +
    `<span class="hint">docker exec cswap-auto /usr/local/bin/docker-entrypoint.sh python -c ` +
    `"import urllib.request;urllib.request.urlopen('https://api.anthropic.com/v1/models',timeout=10)"` +
    `\n→ HTTP 401 = TLS ổn (lỗi mạng thật) · CERTIFICATE_VERIFY_FAILED = thiếu CA bundle</span>`;
  el.className = "show";
}

grid.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "switch") post("/api/switch", { identifier: id });
  else if (b.dataset.act === "toggle")
    post("/api/disabled", { identifier: id, disabled: b.dataset.on === "1" });
  else if (b.dataset.act === "alias") {
    const v = prompt(`Alias cho slot ${id}\n(chữ, số, - _ . — không được toàn số)`);
    if (v && v.trim()) post("/api/alias", { identifier: id, alias: v.trim() });
  }
});

$("pause").onclick = () => post("/api/autoswitch", { paused: !paused });
$("rotate").onclick = () => post("/api/switch-strategy", { strategy: null });
$("avail").onclick = () => post("/api/switch-strategy", { strategy: "next-available" });
$("best").onclick = () => post("/api/switch-strategy", { strategy: "best" });

// Live stream. The cookie set on the page load authenticates this, so the
// token never rides in a fetch URL.
let es, backoff = 1000;
function connect() {
  es = new EventSource("/api/events");
  es.onopen = () => { dot.className = "dot live"; backoff = 1000; };
  es.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch (_) {} };
  es.onerror = () => {
    dot.className = "dot dead";
    es.close();
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
}
connect();

// Drop the token out of the address bar once the cookie is pinned.
if (location.search) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>

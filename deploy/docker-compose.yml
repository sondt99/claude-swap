# Always-on cswap: web dashboard + autoswitch engine.
#
# Neither container ships claude-swap. Both run the uv tool venv from the
# mounted home, so they execute the *same* install as your host `cswap` — one
# copy, no version pinning, no drift, and `cswap` on the host stays
# authoritative.
#
# The home directory is mounted at its *identical* path so every path
# claude-swap derives (Path.home(), $XDG_DATA_HOME/claude-swap,
# $HOME/.claude.json, and the venv itself) resolves to the same file the host
# CLI uses, with no translation layer.
#
# It has to be the whole home directory, not just the data files: claude-swap
# publishes ~/.claude.json by atomic rename (switcher._write_json ->
# fsutil.replace_with_retry -> os.replace), and renaming onto a Docker
# single-file bind mount fails with EBUSY, which that helper only retries for
# Windows error codes. Mounting the parent directory is what makes the rename
# land on the host.

# Only `web` declares build:, so there is one image and one build. Compose
# builds every buildable service before starting any, so nothing here depends
# on start order to get the image built.
x-common: &common
  image: cswap-web:1
  user: "${HOST_UID}:${HOST_GID}"
  environment:
    HOME: "${HOST_HOME}"
    TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    # Without this, Python block-buffers stdout whenever it is a pipe — which
    # it always is under Docker. `cswap auto` then logs nothing for hours and
    # the engine looks dead while it is in fact switching accounts normally.
    # (Diagnosed 2026-09-01: last visible log line was three days stale while
    # autoswitch_state.json showed a switch minutes earlier.)
    PYTHONUNBUFFERED: "1"
    # Cadence for the tick loop. autoswitch.intervalSeconds does NOT apply
    # here: `cswap auto --once` evaluates once and returns, so the interval
    # belongs to whatever drives it — this.
    CSWAP_TICK_S: "${CSWAP_TICK_S:-15}"
  volumes:
    - "${HOST_HOME:?set HOST_HOME in deploy/.env}:${HOST_HOME}"
    - /etc/localtime:/etc/localtime:ro
  restart: unless-stopped
  # PID 1 discards default-disposition signals, so a plain `sh` loop never sees
  # SIGTERM: every `docker compose down` waited the full grace period and then
  # SIGKILLed, with a small chance of landing mid-switch (each file write is
  # atomic, but the credential/config/sequence trio is not). tini forwards it.
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Neither service writes to the rootfs; everything lands in the mounted home.
  # /tmp still has to exist and be writable — plenty of stdlib paths assume it
  # — so it is a tmpfs rather than a writable image layer.
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 256
  # The engine emits ~8k lines/day and json-file defaults to no rotation, so
  # this grew unbounded in /var/lib/docker.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *common
    build:
      context: .
    container_name: cswap-web
    environment:
      HOME: "${HOST_HOME}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      # Repeated from x-common on purpose: `<<:` REPLACES `environment:`
      # wholesale rather than merging it, so anything this block does not
      # restate is dropped for this service alone.
      PYTHONUNBUFFERED: "1"
      # No token: http://127.0.0.1:8787/ opens straight up. Deliberate —
      # loopback bind, Origin check and Host pin still block anything coming
      # through a browser; what this concedes is that any *local* process can
      # POST a switch. Set to 0 (and use CSWAP_WEB_TOKEN below) to re-enable.
      CSWAP_WEB_NO_AUTH: "1"
      # Kept for when auth is turned back on: a stable token means the
      # bookmark survives a restart (value in .env).
      CSWAP_WEB_TOKEN: "${CSWAP_WEB_TOKEN}"
    # Published to loopback only — never 0.0.0.0. The server binds 0.0.0.0
    # *inside* the container so this publish can reach it; the host-side
    # 127.0.0.1 is what actually limits exposure.
    ports:
      - "127.0.0.1:8787:8787"
    # CMD-SHELL, not CMD: healthchecks bypass the entrypoint, so the venv is
    # not on PATH here and the interpreter needs its full path.
    healthcheck:
      test: ["CMD-SHELL",
             "$$HOME/.local/share/uv/tools/claude-swap/bin/python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  auto:
    <<: *common
    container_name: cswap-auto
    depends_on:
      # Start order only. This does NOT order builds — compose builds before it
      # starts anything — and `auto` has no build: to order anyway. Kept so the
      # dashboard is up by the time the first tick logs.
      - web
    # The autoswitch engine, driven by our own tick loop rather than `cswap
    # auto`'s built-in one — see autoswitch-loop.sh for why (settings.json is
    # re-read every tick instead of once at startup).
    command: ["/usr/local/bin/autoswitch-loop.sh"]
    # Asserts the engine is TICKING, not merely that a process exists: the loop
    # touches the heartbeat only after a tick that actually evaluated, so a
    # permanently failing `cswap` no longer reads as healthy. Allowed staleness
    # is four intervals, which tolerates one slow usage fetch.
    healthcheck:
      test: ["CMD-SHELL",
             "hb=\"${XDG_DATA_HOME:-$$HOME/.local/share}/claude-swap/.autoloop-heartbeat\"; test -f \"$$hb\" && test $$(( $$(date +%s) - $$(stat -c %Y \"$$hb\") )) -lt $$(( ${CSWAP_TICK_S:-15} * 4 ))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first tick has to land before this can pass.
      start_period: 60s
